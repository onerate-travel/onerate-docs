name: Deploy

# A push to `main` publishes docs.onerate.travel, after the full gate. That is the only automatic
# path: this repo has no `staging` branch and is not getting one, so staging stays a deliberate
# rehearsal you ask for by hand. Unlike onerate-app — which does split staging and main across two
# branches — the docs site has one live surface and a preview URL, not two environments people work
# against in parallel.
#
# `inputs.environment || 'production'` is how the two triggers meet, and it is written that way
# rather than tested against `github.event_name`: on a push the `inputs` context is empty, so the
# fallback fires; on a dispatch the input is required and always set. One short expression, no
# event-name branch to keep in step with the trigger list.
#
# The gate runs either way, because the deploy steps come after it in the same job: automatic does
# not mean unchecked, exactly as manual did not. To rehearse on the preview URL, or to re-run after
# a flake:
#   gh workflow run deploy.yml --ref main -f environment=staging
#
# Or `make deploy-prod`, which runs the same gate on your laptop and adds the guards a trigger
# cannot check — clean tree, right branch, branch pushed.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Where to publish after the gate passes'
        type: choice
        required: true
        default: staging
        options: [staging, production]

# Least privilege. Nothing here needs more than a checkout; the deploy authenticates to Cloudflare
# with its own token, not with GITHUB_TOKEN.
permissions:
  contents: read

# Two runs must not interleave. Keyed by environment: a preview upload has no reason to queue
# behind a production deploy. `cancel-in-progress: false` is the load-bearing half — cancelling a
# deploy mid-flight is a worse state than waiting.
#
# The key used to be a bare `inputs.environment`, on the argument that one trigger made it
# impossible to be empty (onerate-app, R11.8). There are two triggers now and a push leaves it
# empty, so the fallback is not decoration — without it every pushed run would share one nameless
# concurrency group with every dispatched one.
concurrency:
  group: deploy-${{ inputs.environment || 'production' }}
  cancel-in-progress: false

jobs:
  # ONE job with two guarded deploy steps, rather than a staging job and a production job. Unlike
  # onerate-landing — where the two differ by a single wrangler argument — these are two different
  # commands, so they cannot collapse into one line. They can still share one gate, and sharing it
  # is the point: duplicated jobs would duplicate the gate and give the copies somewhere to drift.
  deploy:
    runs-on: self-hosted
    timeout-minutes: 15
    # A GitHub environment, so the Cloudflare token can be scoped to it rather than repo-wide and a
    # required reviewer or wait timer can be attached in repo settings WITHOUT another code change.
    # Declaring it does not itself gate anything; it creates the place a gate can hang.
    environment: ${{ inputs.environment || 'production' }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      # First, before the checkout: a dispatch from the wrong ref should cost nothing.
      - name: Production ships from main only
        if: (inputs.environment || 'production') == 'production' && github.ref != 'refs/heads/main'
        run: |
          echo "::error::production deploys must be dispatched from main (got ${{ github.ref }})"
          exit 1

      # This repository has no Cloudflare secrets yet (ROADMAP.md D1). Without this the run would
      # do the whole gate and then fail inside wrangler with an auth error that says nothing about
      # why — so it names the missing thing, and where the instructions for it live, up front.
      - name: Cloudflare credentials must exist
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: |
          echo "::error::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not set for the '${{ inputs.environment || 'production' }}' environment. See ROADMAP.md item D1 — the token must be scoped to 'Account · Workers Scripts · Edit' and must not be the app or landing repo's."
          exit 1

      # Pinned to commit SHAs, not tags: a tag is mutable, and this job holds the Cloudflare
      # token. Same convention as onerate-egress's ci.yml, for the same reason.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Build BEFORE test, not after. test/links.test.js reads `dist/` — the shipped site — so
      # running it first would either check the previous build or, on a clean checkout, check
      # nothing at all. The suite refuses to pass on an empty `dist/` for exactly this reason.
      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Check types and content schema
        run: npm run check

      # `versions upload` publishes a version with its own preview URL and leaves the live route
      # untouched; `deploy` promotes to docs.onerate.travel. Two commands, so two steps — collapsing
      # them would need a shell conditional that reads worse than a pair of `if:` guards.
      - name: Upload preview version (staging)
        if: inputs.environment == 'staging'
        run: npx wrangler versions upload

      - name: Deploy (production)
        if: (inputs.environment || 'production') == 'production'
        run: npx wrangler deploy
